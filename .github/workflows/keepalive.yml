name: keep-alive

# Render'ın ücretsiz web servisi 15 dk hareketsizlikte uyuyor; uyurken
# arka plan job'ları (server/src/jobs/cooldownReminder.js - "1 saat kaldı",
# "ritüel hazır", "ödül geri sayımı") da durur. Bu iş her ~10 dakikada bir
# /health'e istek atıp servisi uyanık tutar.
#
# Not: GitHub, 60 gün repo hareketsizliğinden sonra zamanlanmış iş akışlarını
# devre dışı bırakır; ayrıca yoğunlukta çalışmalar birkaç dakika gecikebilir.
# Kalıcı çözüm için Render Starter ($7/ay) planına geçilebilir.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 https://velis-api.onrender.com/health || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "health check did not return 200"
          exit 1
